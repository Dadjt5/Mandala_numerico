<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala - Reacción en cadena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Fraunces:opsz,wght@9..144,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">

        <header class="cabecera">
            <h1 class="titulo">Mandala geométrico</h1>
            <p class="subtitulo">
                Toca una celda para infundirle energía. Cuando alcanza su límite se desborda
                y contagia a sus vecinas en cadena.
            </p>
        </header>

        <section class="panel controles">
            <div class="controles-grid">
                <div class="campo">
                    <label for="cantidad-colores">Nº de colores</label>
                    <select id="cantidad-colores">
                        <option value="3">3 colores</option>
                        <option value="4" selected>4 colores</option>
                        <option value="5">5 colores</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cantidad-celdas">Tamaño del tablero</label>
                    <select id="cantidad-celdas">
                        <option value="5">5 celdas (mini)</option>
                        <option value="13" selected>13 celdas (estándar)</option>
                        <option value="25">25 celdas (grande)</option>
                        <option value="41">41 celdas (épico)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="preset-paletas">Paleta</label>
                    <select id="preset-paletas">
                        <option value="neon">Neón vibrante</option>
                        <option value="zen">Zen meditación</option>
                        <option value="sunset">Atardecer dorado</option>
                        <option value="pastel">Dulce pastel</option>
                        <option value="cosmic">Místico cósmico</option>
                        <option value="custom">Personalizada</option>
                    </select>
                </div>

                <button id="btn-nueva-partida" class="btn-nueva" type="button">Nueva partida</button>
            </div>

            <div class="paleta">
                <span class="paleta-titulo">Ajusta cada color</span>
                <div id="contenedor-paleta" class="paleta-selectores"></div>
            </div>
        </section>

        <main class="juego">
            <div class="marcador">
                <span class="marcador-etiqueta">Total</span>
                <span id="total" class="marcador-valor" aria-live="polite">0</span>
            </div>

            <section class="escenario" aria-label="Tablero del mandala">
                <div id="tablero" class="tablero" role="group"></div>
            </section>

            <p id="mensaje" class="mensaje" role="status"></p>
        </main>

        <footer class="pie">Mandala &bull; Reacción en cadena</footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
