<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mandala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="juego">
        <header class="cabecera">
            <h1>Mandala</h1>
            <p class="ayuda">Toca una celda para pintarla. Cuando se llena, se desborda hacia sus vecinas.</p>
        </header>

        <div class="controles">
            <div class="campo">
                <label for="cantidad-colores">Colores</label>
                <select id="cantidad-colores">
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="campo">
                <label for="cantidad-celdas">Celdas</label>
                <input id="cantidad-celdas" type="number" value="10" min="3" max="60">
            </div>

            <button id="btn-nueva-partida" class="btn-principal">Nueva partida</button>
        </div>

        <p class="puntos" aria-live="polite"><span id="total">0</span> puntos</p>

        <section class="escenario" aria-label="Tablero del mandala">
            <div id="tablero" role="group"></div>
        </section>

        <p id="mensaje" class="mensaje" role="status"></p>
    </main>

    <script src="/game.js"></script>
</body>
</html>
